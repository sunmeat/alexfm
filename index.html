<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <title>Alex FM</title>
  <meta name="description" content="Онлайн-радио с общим эфиром, караоке-текстами и живыми визуализациями на весь экран. Один эфир. Много визуалов." />
  <link rel="canonical" href="https://alexfm.vercel.app/" />

  <!-- Open Graph (для Telegram, Discord, VK, Facebook и т.д.) -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Alex FM" />
  <meta property="og:title" content="Alex FM — онлайн-радио" />
  <meta property="og:description" content="Онлайн-радио с общим эфиром, караоке-текстами и живыми визуализациями на весь экран." />
  <meta property="og:image" content="https://alexfm.vercel.app/og-image.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:url" content="https://alexfm.vercel.app/" />
  <meta property="og:locale" content="ru_RU" />

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Alex FM — онлайн-радио" />
  <meta name="twitter:description" content="Онлайн-радио с общим эфиром, караоке-текстами и живыми визуализациями на весь экран." />
  <meta name="twitter:image" content="https://alexfm.vercel.app/og-image.jpg" />

  <meta name="theme-color" content="#000000" />

  <link rel="stylesheet" href="styles.css">
</head>
<body>
<canvas id="viz"></canvas>
<div class="content">
  <div class="brand">
    <h1>ALEX FM</h1>
    <div class="live-badge"><span class="live-dot"></span>LIVE</div>
  </div>
  <div id="trackInfo">Загрузка...</div>
  <div class="controls">
    <button id="playBtn">▶ Слушать</button>
    <div class="volume-wrap">
      🔊 <input type="range" id="volume" min="0" max="1" step="0.01" value="0.8">
    </div>
  </div>
  <div id="status"></div>
  <div id="lyrics"></div>
</div>
<div class="hint" id="hint">клик в любом месте страницы — сменить визуализацию</div>
<audio id="player" preload="auto" style="display:none"></audio>
<script src="scripts/visualizers.js"></script>
<script src="scripts/app.js"></script>
</body>
</html>
