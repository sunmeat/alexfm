<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alex FM</title>
<style>
  :root {
    --accent1: #00e5ff;
    --accent2: #ff00e5;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: #05050a;
    color: #eee;
    font-family: system-ui, -apple-system, sans-serif;
    overflow-x: hidden;
  }
  #viz {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    z-index: 0;
    display: block;
  }
  .content {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    text-align: center;
    pointer-events: none;
  }
  .content > * { pointer-events: auto; }
  .brand {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 4px;
  }
  h1 {
    margin: 0;
    font-size: 30px;
    letter-spacing: 2px;
    background: linear-gradient(90deg, var(--accent1), var(--accent2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 30px rgba(0,229,255,0.3);
  }
  .live-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    letter-spacing: 1px;
    color: #ff4d4d;
    border: 1px solid #ff4d4d;
    border-radius: 20px;
    padding: 3px 10px;
    background: rgba(10,10,15,0.4);
  }
  .live-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #ff4d4d;
    animation: blink 1.4s infinite;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.25} }
  #trackInfo {
    opacity: 0.9;
    margin: 16px 0 22px;
    min-height: 22px;
    font-size: 15px;
    text-shadow: 0 0 12px rgba(0,0,0,0.8);
  }
  .controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    background: rgba(20,20,28,0.55);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px;
    padding: 14px 22px;
  }
  #playBtn {
    background: linear-gradient(135deg, var(--accent1), var(--accent2));
    border: none;
    color: #05050a;
    font-weight: 700;
    font-size: 14px;
    padding: 12px 26px;
    border-radius: 30px;
    cursor: pointer;
    letter-spacing: 0.5px;
  }
  #playBtn:active { transform: scale(0.97); }
  .volume-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    opacity: 0.75;
  }
  input[type="range"] {
    accent-color: var(--accent1);
    width: 110px;
  }
  #status { margin-top: 12px; font-size: 12px; opacity: 0.6; text-shadow: 0 0 10px rgba(0,0,0,0.8); }
  #lyrics {
    display: none;
    width: min(640px, 90vw);
    margin: 22px auto 0;
    background: rgba(20,20,28,0.55);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px;
    padding: 20px;
    max-height: 240px;
    overflow-y: auto;
    line-height: 1.9;
    font-size: 15px;
    white-space: pre-wrap;
  }
  #lyrics .line {
    opacity: 0.4;
    transition: opacity 0.25s, color 0.25s, transform 0.25s;
  }
  #lyrics .line.active {
    opacity: 1;
    color: var(--accent1);
    transform: scale(1.04);
    font-weight: 600;
  }
  #lyrics::-webkit-scrollbar { width: 6px; }
  #lyrics::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
  .hint {
    position: fixed;
    bottom: 14px;
    left: 0; right: 0;
    text-align: center;
    font-size: 11px;
    opacity: 0.45;
    z-index: 1;
    pointer-events: none;
    text-shadow: 0 0 10px rgba(0,0,0,0.9);
  }
</style>
</head>
<body>
<canvas id="viz"></canvas>
<div class="content">
  <div class="brand">
    <h1>ALEX FM</h1>
    <div class="live-badge"><span class="live-dot"></span>LIVE</div>
  </div>
  <div id="trackInfo">Загрузка...</div>
  <div class="controls">
    <button id="playBtn">▶ Слушать</button>
    <div class="volume-wrap">
      🔊 <input type="range" id="volume" min="0" max="1" step="0.01" value="0.8">
    </div>
  </div>
  <div id="status"></div>
  <div id="lyrics"></div>
</div>
<div class="hint" id="hint">клик в любом месте страницы — сменить визуализацию</div>
<audio id="player" preload="auto" style="display:none"></audio>
<script>
const player = document.getElementById('player');
const trackInfo = document.getElementById('trackInfo');
const statusEl = document.getElementById('status');
const playBtn = document.getElementById('playBtn');
const volumeSlider = document.getElementById('volume');
const lyricsBox = document.getElementById('lyrics');
const canvas = document.getElementById('viz');
const ctx = canvas.getContext('2d');
const hintEl = document.getElementById('hint');
player.volume = parseFloat(volumeSlider.value);
volumeSlider.addEventListener('input', () => { player.volume = parseFloat(volumeSlider.value); });
let currentFile = null;
let resyncTimer = null;
let isPlaying = false;
let lyricsData = null;
async function fetchNowPlaying() {
  const res = await fetch('/api/now-playing');
  return res.json();
}
async function syncToLive(forceRestart = false) {
  const data = await fetchNowPlaying();
  const networkDelay = (Date.now() / 1000) - data.serverTime;
  const targetOffset = data.offset + Math.max(networkDelay, 0);
  trackInfo.textContent = data.artist ? `${data.artist} — ${data.title}` : data.title;
  if (data.file !== currentFile || forceRestart) {
    currentFile = data.file;
    player.src = '/tracks/' + encodeURIComponent(data.file);
    player.currentTime = targetOffset;
    if (isPlaying) player.play().catch(() => {});
    loadLyrics(data.artist, data.title);
  } else {
    const drift = Math.abs(player.currentTime - targetOffset);
    if (drift > 2) player.currentTime = targetOffset;
  }
  clearTimeout(resyncTimer);
  const nextCheckIn = Math.min(Math.max(data.nextTrackIn, 1), 30);
  resyncTimer = setTimeout(() => syncToLive(), nextCheckIn * 1000);
}
syncToLive(true);
setInterval(() => syncToLive(), 30000);
let lastKnownTime = 0;
player.addEventListener('timeupdate', () => { lastKnownTime = player.currentTime; });
player.addEventListener('seeking', () => {
  if (Math.abs(player.currentTime - lastKnownTime) > 1.5) {
    player.currentTime = lastKnownTime;
  }
});
playBtn.addEventListener('click', async (e) => {
  e.stopPropagation();
  if (!audioCtx) setupAudioGraph();
  if (audioCtx.state === 'suspended') await audioCtx.resume();
  if (!isPlaying) {
    isPlaying = true;
    statusEl.textContent = '';
    await syncToLive(true);
    player.play();
    playBtn.textContent = '⏸ Пауза';
  } else {
    isPlaying = false;
    player.pause();
    playBtn.textContent = '▶ Слушать';
  }
});
volumeSlider.addEventListener('click', (e) => e.stopPropagation());
let audioCtx, analyser, source, freqData, timeData;
let vizMode = 0;
const modeNames = [
  'Бары', 'Круговая', 'Осциллограф', 'Частицы', 'Тоннель', 'Калейдоскоп',
  'Спираль', 'Сетка', 'Молнии', 'Плазма', 'Звёзды', 'Вихрь'
];
function setupAudioGraph() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  source = audioCtx.createMediaElementSource(player);
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 512;
  source.connect(analyser);
  analyser.connect(audioCtx.destination);
  freqData = new Uint8Array(analyser.frequencyBinCount);
  timeData = new Uint8Array(analyser.fftSize);
  resizeCanvas();
  requestAnimationFrame(drawVisualizer);
}
function resizeCanvas() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = window.innerWidth * dpr;
  canvas.height = window.innerHeight * dpr;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();
document.addEventListener('click', (e) => {
  if (e.target.closest('.controls')) return;
  vizMode = (vizMode + 1) % modeNames.length;
  hintEl.textContent = modeNames[vizMode];
  hintEl.style.opacity = '0.8';
  clearTimeout(hintEl._t);
  hintEl._t = setTimeout(() => { hintEl.style.opacity = '0.45'; hintEl.textContent = 'клик в любом месте страницы — сменить визуализацию'; }, 1500);
});
function average(arr, start, end) {
  let sum = 0;
  for (let i = start; i < end; i++) sum += arr[i];
  return sum / (end - start);
}
function drawVisualizer() {
  requestAnimationFrame(drawVisualizer);
  const w = canvas.width, h = canvas.height;
  ctx.fillStyle = 'rgba(5,5,10,0.22)';
  ctx.fillRect(0, 0, w, h);
  if (!analyser) return;
  if (vizMode === 0) drawBars(w, h);
  else if (vizMode === 1) drawCircular(w, h);
  else if (vizMode === 2) drawWave(w, h);
  else if (vizMode === 3) drawParticles(w, h);
  else if (vizMode === 4) drawTunnel(w, h);
  else if (vizMode === 5) drawKaleido(w, h);
  else if (vizMode === 6) drawSpiral(w, h);
  else if (vizMode === 7) drawGrid(w, h);
  else if (vizMode === 8) drawLightning(w, h);
  else if (vizMode === 9) drawPlasma(w, h);
  else if (vizMode === 10) drawStars(w, h);
  else drawVortex(w, h);
}
function drawBars(w, h) {
  analyser.getByteFrequencyData(freqData);
  const barCount = 64;
  const step = Math.floor(freqData.length / barCount);
  const barWidth = w / barCount;
  const midY = h / 2;
  for (let i = 0; i < barCount; i++) {
    const v = freqData[i * step] / 255;
    const barH = v * (h * 0.42);
    const hue = (i / barCount) * 280 + (Date.now() / 30 % 360);
    ctx.fillStyle = `hsl(${hue}, 100%, 60%)`;
    ctx.shadowColor = `hsl(${hue}, 100%, 60%)`;
    ctx.shadowBlur = 10;
    const x = i * barWidth + 2;
    ctx.fillRect(x, midY - barH, barWidth - 4, barH);
    ctx.fillRect(x, midY, barWidth - 4, barH * 0.6);
  }
  ctx.shadowBlur = 0;
}
function drawCircular(w, h) {
  analyser.getByteFrequencyData(freqData);
  const cx = w / 2, cy = h / 2;
  const baseRadius = Math.min(w, h) * 0.16;
  const bars = 90;
  const step = Math.floor(freqData.length / bars);
  for (let i = 0; i < bars; i++) {
    const v = freqData[i * step] / 255;
    const angle = (i / bars) * Math.PI * 2;
    const len = baseRadius * 0.4 + v * baseRadius * 2.2;
    const x1 = cx + Math.cos(angle) * baseRadius;
    const y1 = cy + Math.sin(angle) * baseRadius;
    const x2 = cx + Math.cos(angle) * (baseRadius + len);
    const y2 = cy + Math.sin(angle) * (baseRadius + len);
    const hue = (i / bars) * 360 + (Date.now() / 20 % 360);
    ctx.strokeStyle = `hsl(${hue}, 100%, 60%)`;
    ctx.shadowColor = `hsl(${hue}, 100%, 60%)`;
    ctx.shadowBlur = 12;
    ctx.lineWidth = Math.max(2, w / 400);
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
  }
  ctx.shadowBlur = 0;
}
function drawWave(w, h) {
  analyser.getByteTimeDomainData(timeData);
  const midY = h / 2;
  ctx.lineWidth = Math.max(2, w / 500);
  ctx.strokeStyle = '#00e5ff';
  ctx.shadowColor = '#00e5ff';
  ctx.shadowBlur = 15;
  ctx.beginPath();
  const slice = w / timeData.length;
  let x = 0;
  for (let i = 0; i < timeData.length; i++) {
    const v = timeData[i] / 128 - 1;
    const y = midY + v * (h * 0.38);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    x += slice;
  }
  ctx.stroke();
  ctx.shadowBlur = 0;
}
let particles = [];
function drawParticles(w, h) {
  analyser.getByteFrequencyData(freqData);
  const bass = average(freqData, 0, 24) / 255;
  const cx = w / 2, cy = h / 2;
  if (bass > 0.45) {
    for (let i = 0; i < 4; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = (2 + bass * 14) * (w / 1000);
      particles.push({
        x: cx, y: cy,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 1,
        hue: Math.random() * 360,
        size: (3 + bass * 10) * (w / 1000)
      });
    }
  }
  particles.forEach(p => {
    p.x += p.vx; p.y += p.vy;
    p.life -= 0.012;
    ctx.beginPath();
    ctx.fillStyle = `hsla(${p.hue},100%,60%,${Math.max(p.life, 0)})`;
    ctx.shadowColor = `hsl(${p.hue},100%,60%)`;
    ctx.shadowBlur = 12;
    ctx.arc(p.x, p.y, Math.max(p.size * p.life, 0), 0, Math.PI * 2);
    ctx.fill();
  });
  particles = particles.filter(p => p.life > 0);
  ctx.shadowBlur = 0;
}
let rings = [];
let ringTimer = 0;
function drawTunnel(w, h) {
  analyser.getByteFrequencyData(freqData);
  const mid = average(freqData, 20, 90) / 255;
  ringTimer++;
  if (ringTimer > 5) {
    ringTimer = 0;
    rings.push({ r: 10, hue: (Date.now() / 10) % 360, width: (2 + mid * 8) * (w / 1000) });
  }
  const cx = w / 2, cy = h / 2;
  const maxR = Math.hypot(w, h) / 2;
  rings.forEach(ring => {
    ring.r += (4 + mid * 18) * (w / 1000);
    ctx.beginPath();
    ctx.strokeStyle = `hsla(${ring.hue},100%,60%,${Math.max(1 - ring.r / maxR, 0)})`;
    ctx.shadowColor = `hsl(${ring.hue},100%,60%)`;
    ctx.shadowBlur = 18;
    ctx.lineWidth = ring.width;
    ctx.arc(cx, cy, ring.r, 0, Math.PI * 2);
    ctx.stroke();
  });
  rings = rings.filter(r => r.r < maxR);
  ctx.shadowBlur = 0;
}
function drawKaleido(w, h) {
  analyser.getByteFrequencyData(freqData);
  const cx = w / 2, cy = h / 2;
  const segments = 8;
  const barsPerSeg = 20;
  const step = Math.floor(freqData.length / barsPerSeg);
  const maxLen = Math.min(w, h) * 0.44;
  for (let s = 0; s < segments; s++) {
    const segAngle = (s / segments) * Math.PI * 2;
    for (let i = 0; i < barsPerSeg; i++) {
      const v = freqData[i * step] / 255;
      const angle = segAngle + (i / barsPerSeg) * (Math.PI * 2 / segments);
      const len = 20 + v * maxLen;
      const x1 = cx + Math.cos(angle) * 20;
      const y1 = cy + Math.sin(angle) * 20;
      const x2 = cx + Math.cos(angle) * len;
      const y2 = cy + Math.sin(angle) * len;
      const hue = (s * 45 + i * 4 + Date.now() / 15) % 360;
      ctx.strokeStyle = `hsl(${hue},100%,60%)`;
      ctx.shadowColor = `hsl(${hue},100%,60%)`;
      ctx.shadowBlur = 8;
      ctx.lineWidth = Math.max(2, w / 500);
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
    }
  }
  ctx.shadowBlur = 0;
}
function drawSpiral(w, h) {
  analyser.getByteFrequencyData(freqData);
  const cx = w / 2, cy = h / 2;
  const arms = 4;
  const points = 80;
  const step = Math.floor(freqData.length / points);
  const maxR = Math.min(w, h) * 0.48;
  const rot = Date.now() / 2000;
  for (let a = 0; a < arms; a++) {
    ctx.beginPath();
    for (let i = 0; i < points; i++) {
      const v = freqData[i * step] / 255;
      const t = i / points;
      const angle = rot + a * (Math.PI * 2 / arms) + t * Math.PI * 4;
      const r = t * maxR * (0.5 + v * 0.9);
      const x = cx + Math.cos(angle) * r;
      const y = cy + Math.sin(angle) * r;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    const hue = (a * 90 + Date.now() / 20) % 360;
    ctx.strokeStyle = `hsl(${hue},100%,60%)`;
    ctx.shadowColor = `hsl(${hue},100%,60%)`;
    ctx.shadowBlur = 14;
    ctx.lineWidth = Math.max(2, w / 450);
    ctx.stroke();
  }
  ctx.shadowBlur = 0;
}
function drawGrid(w, h) {
  analyser.getByteFrequencyData(freqData);
  const cols = 16;
  const rows = 10;
  const cellW = w / cols;
  const cellH = h / rows;
  const bass = average(freqData, 0, 20) / 255;
  const mid = average(freqData, 20, 80) / 255;
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      const idx = Math.floor(((x + y * cols) / (cols * rows)) * freqData.length);
      const v = freqData[idx] / 255;
      const scale = 0.3 + v * 0.7 + bass * 0.2;
      const cx = (x + 0.5) * cellW;
      const cy = (y + 0.5) * cellH;
      const size = Math.min(cellW, cellH) * 0.35 * scale;
      const hue = (x * 20 + y * 30 + Date.now() / 25) % 360;
      ctx.fillStyle = `hsla(${hue},100%,55%,${0.3 + v * 0.7})`;
      ctx.shadowColor = `hsl(${hue},100%,55%)`;
      ctx.shadowBlur = 8 + mid * 12;
      ctx.beginPath();
      ctx.arc(cx, cy, size, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.shadowBlur = 0;
}
let bolts = [];
function drawLightning(w, h) {
  analyser.getByteFrequencyData(freqData);
  const bass = average(freqData, 0, 18) / 255;
  const cx = w / 2, cy = h / 2;
  if (bass > 0.55 && Math.random() < 0.35) {
    const angle = Math.random() * Math.PI * 2;
    const len = Math.min(w, h) * (0.25 + bass * 0.4);
    bolts.push({
      x: cx, y: cy,
      angle, len,
      life: 1,
      hue: 180 + Math.random() * 120,
      segs: 6 + Math.floor(Math.random() * 5)
    });
  }
  bolts.forEach(b => {
    b.life -= 0.04;
    ctx.beginPath();
    ctx.moveTo(b.x, b.y);
    let px = b.x, py = b.y;
    const segLen = b.len / b.segs;
    for (let i = 0; i < b.segs; i++) {
      const jitter = (Math.random() - 0.5) * 40 * (w / 1000);
      const a = b.angle + (Math.random() - 0.5) * 0.6;
      px += Math.cos(a) * segLen + jitter;
      py += Math.sin(a) * segLen + jitter;
      ctx.lineTo(px, py);
    }
    ctx.strokeStyle = `hsla(${b.hue},100%,70%,${Math.max(b.life, 0)})`;
    ctx.shadowColor = `hsl(${b.hue},100%,70%)`;
    ctx.shadowBlur = 20;
    ctx.lineWidth = Math.max(1.5, w / 600) * b.life;
    ctx.stroke();
  });
  bolts = bolts.filter(b => b.life > 0);
  ctx.shadowBlur = 0;
}
let plasmaBlobs = [];
function drawPlasma(w, h) {
  analyser.getByteFrequencyData(freqData);
  const bass = average(freqData, 0, 24) / 255;
  const mid = average(freqData, 24, 100) / 255;
  const cx = w / 2, cy = h / 2;
  if (plasmaBlobs.length < 12) {
    plasmaBlobs.push({
      x: cx + (Math.random() - 0.5) * w * 0.6,
      y: cy + (Math.random() - 0.5) * h * 0.6,
      vx: (Math.random() - 0.5) * 2,
      vy: (Math.random() - 0.5) * 2,
      baseR: 30 + Math.random() * 50,
      hue: Math.random() * 360,
      phase: Math.random() * Math.PI * 2
    });
  }
  plasmaBlobs.forEach(b => {
    b.x += b.vx * (1 + mid * 3);
    b.y += b.vy * (1 + mid * 3);
    b.phase += 0.05;
    if (b.x < 0 || b.x > w) b.vx *= -1;
    if (b.y < 0 || b.y > h) b.vy *= -1;
    const r = b.baseR * (0.6 + bass * 0.8 + Math.sin(b.phase) * 0.2) * (w / 1000);
    const g = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, r);
    g.addColorStop(0, `hsla(${b.hue},100%,65%,0.55)`);
    g.addColorStop(0.5, `hsla(${(b.hue + 40) % 360},100%,50%,0.25)`);
    g.addColorStop(1, `hsla(${b.hue},100%,40%,0)`);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(b.x, b.y, r, 0, Math.PI * 2);
    ctx.fill();
  });
}
let starField = [];
function drawStars(w, h) {
  analyser.getByteFrequencyData(freqData);
  const bass = average(freqData, 0, 20) / 255;
  const treble = average(freqData, 100, 200) / 255;
  if (starField.length < 80) {
    for (let i = 0; i < 80 - starField.length; i++) {
      starField.push({
        x: Math.random() * w,
        y: Math.random() * h,
        z: Math.random(),
        hue: Math.random() * 360
      });
    }
  }
  const cx = w / 2, cy = h / 2;
  starField.forEach(s => {
    s.z -= 0.004 + bass * 0.02;
    if (s.z <= 0) {
      s.x = Math.random() * w;
      s.y = Math.random() * h;
      s.z = 1;
      s.hue = Math.random() * 360;
    }
    const sx = cx + (s.x - cx) / s.z;
    const sy = cy + (s.y - cy) / s.z;
    const size = (1 - s.z) * 4 * (1 + treble) * (w / 1000);
    ctx.beginPath();
    ctx.fillStyle = `hsla(${s.hue},100%,70%,${1 - s.z})`;
    ctx.shadowColor = `hsl(${s.hue},100%,70%)`;
    ctx.shadowBlur = 8;
    ctx.arc(sx, sy, Math.max(size, 0.5), 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.shadowBlur = 0;
}
function drawVortex(w, h) {
  analyser.getByteFrequencyData(freqData);
  const cx = w / 2, cy = h / 2;
  const layers = 6;
  const points = 48;
  const step = Math.floor(freqData.length / points);
  const maxR = Math.min(w, h) * 0.46;
  const rot = Date.now() / 1500;
  for (let L = 0; L < layers; L++) {
    const layerR = maxR * ((L + 1) / layers);
    ctx.beginPath();
    for (let i = 0; i <= points; i++) {
      const v = freqData[(i % points) * step] / 255;
      const t = i / points;
      const angle = rot * (1 + L * 0.3) + t * Math.PI * 2 + L * 0.4;
      const r = layerR * (0.7 + v * 0.5);
      const x = cx + Math.cos(angle) * r;
      const y = cy + Math.sin(angle) * r;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
    const hue = (L * 55 + Date.now() / 18) % 360;
    ctx.strokeStyle = `hsla(${hue},100%,60%,${0.4 + (layers - L) * 0.1})`;
    ctx.shadowColor = `hsl(${hue},100%,60%)`;
    ctx.shadowBlur = 10;
    ctx.lineWidth = Math.max(1.5, w / 500);
    ctx.stroke();
  }
  ctx.shadowBlur = 0;
}
function parseLRC(lrc) {
  const timeRe = /\[(\d{2}):(\d{2})(?:[.:](\d{2,3}))?\]/g;
  const result = [];
  for (const rawLine of lrc.split('\n')) {
    const matches = [...rawLine.matchAll(timeRe)];
    if (!matches.length) continue;
    const text = rawLine.replace(timeRe, '').trim();
    if (!text) continue;
    for (const m of matches) {
      const min = parseInt(m[1], 10);
      const sec = parseInt(m[2], 10);
      const ms = m[3] ? parseInt(m[3].padEnd(3, '0'), 10) : 0;
      result.push({ time: min * 60 + sec + ms / 1000, text });
    }
  }
  return result.sort((a, b) => a.time - b.time);
}
async function loadLyrics(artist, title) {
  lyricsData = null;
  lyricsBox.style.display = 'none';
  lyricsBox.innerHTML = '';
  if (!title) return;
  try {
    const url = `/api/lyrics?artist=${encodeURIComponent(artist || '')}&title=${encodeURIComponent(title)}`;
    const res = await fetch(url);
    const data = await res.json();
    if (!data.found) return;
    if (data.synced) {
      const lines = parseLRC(data.synced);
      if (!lines.length) return;
      lyricsData = { type: 'synced', lines };
      lyricsBox.innerHTML = lines.map(l => `<div class="line">${escapeHtml(l.text)}</div>`).join('');
      lyricsBox.style.display = 'block';
    } else if (data.plain) {
      lyricsData = { type: 'plain', text: data.plain };
      lyricsBox.textContent = data.plain;
      lyricsBox.style.display = 'block';
    }
  } catch (e) {}
}
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
player.addEventListener('timeupdate', () => {
  if (!lyricsData || lyricsData.type !== 'synced') return;
  const t = player.currentTime;
  const lines = lyricsData.lines;
  let idx = -1;
  for (let i = 0; i < lines.length; i++) {
    if (lines[i].time <= t) idx = i; else break;
  }
  const els = lyricsBox.children;
  for (let i = 0; i < els.length; i++) {
    els[i].classList.toggle('active', i === idx);
  }
  if (idx >= 0 && els[idx]) {
    els[idx].scrollIntoView({ block: 'center', behavior: 'smooth' });
  }
});
</script>
