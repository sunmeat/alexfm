<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alex FM</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<canvas id="viz"></canvas>
<div class="content">
  <div class="brand">
    <h1>ALEX FM</h1>
    <div class="live-badge"><span class="live-dot"></span>LIVE</div>
  </div>
  <div id="trackInfo">Загрузка...</div>
  <div class="controls">
    <button id="playBtn">▶ Слушать</button>
    <div class="volume-wrap">
      🔊 <input type="range" id="volume" min="0" max="1" step="0.01" value="0.8">
    </div>
  </div>
  <div id="status"></div>
  <div id="lyrics"></div>
</div>
<div class="hint" id="hint">клик в любом месте страницы — сменить визуализацию</div>
<audio id="player" preload="auto" style="display:none"></audio>
<script src="scripts/visualizers.js"></script>
<script src="scripts/app.js"></script>
</body>
</html>
